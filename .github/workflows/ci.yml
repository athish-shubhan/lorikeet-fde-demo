name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests + eval regression gate (offline, scripted model, no API key)
        run: pytest -q
      - name: Eval report, discovery replay, HTML report
        run: |
          python -m evals.run --out evals/results.md
          python -m discovery.analyse > /dev/null
          python -m evals.html
          cat evals/results.md >> "$GITHUB_STEP_SUMMARY"
      - name: Committed reports are up to date
        run: git diff --exit-code -- evals/results.md discovery/report.md
      - uses: actions/upload-artifact@v4
        with:
          name: reports-py${{ matrix.python-version }}
          path: |
            evals/results.md
            discovery/report.md
            report/index.html
